<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank You | Shri Tulsi Vatika</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100vh}
    body{font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#1a182b,#292541);color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;line-height:1.6}
    .box{max-width:520px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:48px 40px;backdrop-filter:blur(6px)}
    .check{width:74px;height:74px;margin:0 auto 22px;background:#d8b15b;color:#17131e;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:38px}
    h1{font-family:Georgia,serif;font-size:32px;margin:0 0 10px;color:#e3c06e}
    p{color:#d9d7df;margin:0 0 8px;font-size:17px}
    .note{font-size:13px;color:#aaa6b5;margin-top:18px}
    a.back{display:inline-block;margin-top:26px;padding:13px 26px;background:#d8b15b;color:#17131e;border-radius:99px;text-decoration:none;font-weight:800}
    a.back:hover{filter:brightness(1.08)}
  </style>
</head>
<body>
  <div class="box">
    <div class="check">&#10003;</div>
    <h1>Thank You!</h1>
    <p>Your enquiry has been received. Our consultant will get in touch with you shortly.</p>
    <a class="back" href="index.html">Back to Home</a>
    <p class="note">For urgent queries call <strong>+91 95604 59051</strong></p>
  </div>
</body>
</html>
